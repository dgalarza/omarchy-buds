name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Plugin checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the plugin
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check out the Omarchy validator
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: basecamp/omarchy
          path: .omarchy-validator
          sparse-checkout: bin/omarchy-plugin-validate
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Install check tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends jq qtdeclarative5-dev-tools

      - name: Validate the plugin manifest
        shell: bash
        run: |
          set -euo pipefail
          plugin_dir="$RUNNER_TEMP/omarchy-buds"
          mkdir -p "$plugin_dir"
          git archive HEAD | tar -x -C "$plugin_dir"
          bash .omarchy-validator/bin/omarchy-plugin-validate "$plugin_dir"

      - name: Check the setup script
        run: bash -n setup

      - name: Lint QML
        run: qmllint ./*.qml

  model:
    name: Deno tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the plugin
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x

      - name: Run Deno tests
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/*.test.js; do
            deno run --allow-read "$test_file"
          done

  hook:
    name: Hook behavior tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Check out the plugin
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 10.0.x

      - name: Run the hook behavior harness
        run: dotnet run --project tests/hook/HookTests.csproj --configuration Release
